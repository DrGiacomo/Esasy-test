# Override para desarrollo local.
#
# Modo de trabajo: la infraestructura (Postgres y Redis) en Docker, y el backend, el worker
# y la pantalla corriendo a mano con `npm run start:dev` para tener recarga en caliente.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up postgres redis -d
#
# Para el arranque de UN SOLO PLAY -todo dentro de Docker, sin Node en la maquina- este
# archivo no se usa:
#
#   docker compose up -d          (o arrancar.bat, que hace lo mismo comprobando antes)
#
# Los puertos NO se declaran aqui. Vivian aqui y ademas en el compose base, y Compose SUMA
# las dos listas: el resultado era publicar 5432 y 5433 a la vez y fallar en cualquier
# maquina con PostgreSQL nativo. Se declaran una sola vez, en el base, con POSTGRES_PORT.
services:
  backend:
    build:
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ./Backend:/app
      - /app/node_modules
    command: npm run start:dev

  worker:
    build:
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ./Backend:/app
      - /app/node_modules
    command: node dist/workers/bootstrap-worker.js
