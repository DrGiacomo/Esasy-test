# Override para desarrollo local — levanta solo infraestructura, backend corre con npm run start:dev
services:
  postgres:
    # El puerto del HOST es configurable a proposito. Clavarlo a 5432 rompe el arranque
    # en cualquier maquina que ya tenga PostgreSQL instalado de forma nativa: el servicio
    # del sistema se queda con el puerto y `localhost:5432` acaba respondiendo desde OTRA
    # base de datos. El sintoma es un "Authentication failed" que no tiene nada que ver
    # con las credenciales, y cuesta media hora entenderlo.
    #   Si te pasa:  POSTGRES_PORT=5433 en tu .env  (y ajusta DATABASE_URL al mismo puerto)
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev

  worker:
    build:
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: node dist/workers/bootstrap-worker.js
