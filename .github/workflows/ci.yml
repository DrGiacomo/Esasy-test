name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancela runs viejos del mismo ref cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # El lint va antes de compilar: es el paso más rápido y el que más veces falla.
      # Sin --fix a propósito — en CI, un lint que arregla y luego aprueba es un gate
      # que se abre solo. Estuvo fuera del pipeline desde junio por 450 errores de
      # CRLF/prettier; se cerraron el 2026-09-04 junto con la causa (.gitattributes).
      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Unit tests
        run: npm test
