# nginx delante de la pantalla de Easy Test.
#
# Hace tres cosas y ninguna es decorativa:
#   1. Sirve los archivos compilados.
#   2. Devuelve index.html en cualquier ruta que no sea un archivo — sin esto, recargar la
#      pagina estando en /tests/algo da un 404: React lleva las rutas por dentro y nginx
#      no las conoce.
#   3. Reenvia /api, /artifacts y /socket.io al backend, para que todo salga por un solo
#      puerto y el navegador no tenga que saber donde vive la API.

server {
    listen 80;
    server_name _;

    # El DNS interno de Docker. Sin esta linea nginx resuelve "backend" UNA vez, al
    # arrancar, y se queda con esa IP: en cuanto el backend se recrea -un despliegue, un
    # `compose up` despues de tocar algo- cambia de IP y la pantalla devuelve 502 hasta
    # que alguien reinicia nginx. Comprobado el 2026-09-05: pasaba de verdad.
    # Con el resolver y la direccion en una variable, se resuelve en cada peticion.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir lo que se manda. El paquete de React son ~700 KB sin esto.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- La aplicacion -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con huella (app-a1b2c3.js) no cambian nunca: se cachean fuerte.
    # index.html NO, o el navegador seguiria abriendo la version vieja tras actualizar.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- El backend ----------------------------------------------------------
    location /api/ {
        # Con la direccion en variable, nginx ya NO anade solo la ruta: hay que pasar
        # $request_uri explicitamente o todas las peticiones acabarian en la raiz.
        proxy_pass http://$backend_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un video de una ejecucion tarda en subir; el minuto por defecto se queda corto.
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # Videos, capturas y trazas de las ejecuciones.
    location /artifacts/ {
        proxy_pass http://$backend_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # --- Tiempo real ---------------------------------------------------------
    # El estado de una ejecucion y la grabacion en vivo viajan por aqui. Sin las dos
    # cabeceras de Upgrade la conexion se abre y se cae al instante, y la pantalla se
    # queda mostrando "PROVISIONING" para siempre sin dar ningun error.
    location /socket.io/ {
        proxy_pass http://$backend_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
